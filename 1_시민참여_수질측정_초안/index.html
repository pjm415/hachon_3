    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#1677ff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="리버로그" />

    <title>리버로그 | 시민참여 수질 측정 & 동백전 리워드</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Kakao Maps API SDK with autoload=false for Single Page App / React -->
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=fdd1b8d20a638e709f6f5b19a4c74955&autoload=false&libraries=services"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    
    <!-- PWA Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => console.log('✅ PWA Service Worker registered:', reg.scope))
            .catch((err) => console.warn('⚠️ PWA Service Worker registration failed:', err));
        });
      }
    </script>
  </body>
