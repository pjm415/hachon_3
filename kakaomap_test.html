<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <title>카카오 지도 공식 가이드 테스트</title>
</head>
<body style="margin:0;padding:20px;font-family:sans-serif;">
    <h2>🟡 카카오 지도 공식 가이드 테스트 페이지</h2>
    <p>아래 지도가 정상적으로 보이면 API 키와 도메인 설정이 100% 성공한 것입니다.</p>
    
    <div id="map" style="width:100%;height:400px;border-radius:12px;border:1px solid #ccc;"></div>

    <!-- Kakao Maps Official SDK Script -->
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=fdd1b8d20a638e709f6f5b19a4c74955&libraries=services"></script>
    <script>
        window.onload = function() {
            var container = document.getElementById('map');
            var options = {
                center: new kakao.maps.LatLng(35.1970, 129.0835), // 부산 온천천 세병교
                level: 3
            };

            var map = new kakao.maps.Map(container, options);

            // 마커 표시
            var markerPosition  = new kakao.maps.LatLng(35.1970, 129.0835); 
            var marker = new kakao.maps.Marker({
                position: markerPosition
            });
            marker.setMap(map);
        };
    </script>
</body>
</html>
